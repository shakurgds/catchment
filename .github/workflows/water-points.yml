name: Weekly surface water at water points

on:
  schedule:
    # Monday 05:20 UTC: checks the 15 days up to Sunday against the 15 before.
    - cron: "20 5 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Last day of the period YYYY-MM-DD (blank = yesterday)"
        default: ""
      points:
        description: "Water points file"
        default: data/water_points.csv
      config:
        description: "Config file"
        default: config/water.yaml

permissions:
  contents: write   # the job commits the finished maps to maps/

concurrency:
  group: water-points
  cancel-in-progress: false

jobs:
  water:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check for a water points file
        id: points
        run: |
          f="${{ inputs.points || 'data/water_points.csv' }}"
          if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No water points file at $f yet; add one to run this workflow."; fi

      - uses: actions/setup-python@v5
        if: steps.points.outputs.file
        with:
          python-version: "3.12"

      - name: Install pinned environment
        if: steps.points.outputs.file
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Tests
        if: steps.points.outputs.file
        run: pytest -q

      - uses: actions/cache@v4
        if: steps.points.outputs.file
        with:
          path: cache/static
          key: static-${{ hashFiles('config/*.yaml') }}

      - name: Check water points
        id: maps
        if: steps.points.outputs.file
        run: |
          args=(--config "${{ inputs.config || 'config/water.yaml' }}" --points "${{ steps.points.outputs.file }}")
          if [ -n "${{ inputs.date }}" ]; then args+=(--date "${{ inputs.date }}"); fi
          out_dir=$(catchment water "${args[@]}" --out maps | tail -1)
          echo "dir=${out_dir}" >> "$GITHUB_OUTPUT"

      - name: Save maps to the repository
        if: steps.points.outputs.file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add maps
          if git diff --cached --quiet; then echo "No new maps"; exit 0; fi
          git commit -m "Add surface water maps $(basename "${{ steps.maps.outputs.dir }}")"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.points.outputs.file
        with:
          name: water-points-${{ github.run_id }}
          path: ${{ steps.maps.outputs.dir }}
          retention-days: 90
