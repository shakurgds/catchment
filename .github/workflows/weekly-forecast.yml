name: Weekly rainfall forecast maps

on:
  schedule:
    # Sunday 06:40 UTC: the 00Z GFS cycle is fully published by ~05:00 UTC.
    - cron: "40 6 * * 0"
  workflow_dispatch:
    inputs:
      run:
        description: "GFS cycle (YYYY-MM-DDTHH) or 'latest'"
        default: latest
      start:
        description: "First day YYYY-MM-DD (blank = next Monday after the run)"
        default: ""
      config:
        description: "Config file"
        default: config/somalia.yaml

permissions:
  contents: write   # the job commits the finished maps to maps/

concurrency:
  group: weekly-forecast
  cancel-in-progress: false

jobs:
  maps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned environment
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Tests
        run: pytest -q

      # Boundaries and HydroBASINS are verified by sha256, so caching them is safe.
      - uses: actions/cache@v4
        with:
          path: cache/static
          key: static-${{ hashFiles('config/*.yaml') }}

      - name: Make maps
        id: maps
        run: |
          args=(--config "${{ inputs.config || 'config/somalia.yaml' }}" --run "${{ inputs.run || 'latest' }}")
          if [ -n "${{ inputs.start }}" ]; then args+=(--start "${{ inputs.start }}"); fi
          out_dir=$(catchment forecast "${args[@]}" --out maps | tail -1)
          echo "dir=${out_dir}" >> "$GITHUB_OUTPUT"

      - name: Save maps to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add maps
          if git diff --cached --quiet; then echo "No new maps"; exit 0; fi
          git commit -m "Add rainfall maps for GFS run $(basename "${{ steps.maps.outputs.dir }}")"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: rainfall-maps-${{ github.run_id }}
          path: ${{ steps.maps.outputs.dir }}
          retention-days: 90
