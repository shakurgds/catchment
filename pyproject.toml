[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchment"
version = "0.1.0"
description = "Reproducible GFS rainfall forecast maps for Somalia and the Juba/Shabelle basins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pygrib>=2.1.5",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
catchment = "catchment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catchment = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
